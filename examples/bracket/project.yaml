# Пилот SkelCAD: сварной кронштейн под ось Ø50 на бетонной стене (пара кронштейнов).
id: bracket
title: "Сварной кронштейн под ось Ø50"
description: >
  Опорная плита на химических анкерах и несущие элементы, через которые проходит ось.
  Три топологии (вилка / ступица / коробка) сравниваются по массе, швам и запасу K.
lang: ru
coordinate_system: "X — вдоль стены (по оси вала), Y — от стены, Z — вверх; Y=0 — плоскость стены"
standards: [gost]
generator: generators/bracket.py
plugins: [plugins/calc.py]

requirements:
  purpose: "Опора горизонтальной оси Ø50 на стене; один кронштейн из пары"
  loads: {Fv: 20, Fh: 4, Fa: 0}          # кН: вниз, от стены, вдоль оси
  factors: {gamma_dyn: 1.3}
  safety_required: 1.5
  environment: {location: "помещение", wall: "бетон B25 с трещинами, толщина ≥ 250 мм"}

skeleton:
  datums:
    - {id: wall, kind: plane, origin: [0, 0, 0], direction: [0, 1, 0], name: "Лицевая плоскость стены"}
    - {id: axle_axis, kind: axis, origin: [0, 200, 0], direction: [1, 0, 0], name: "Ось вала (вылет 200)"}
  interfaces:
    - id: wall
      kind: mount_plane
      name: "Крепление к стене"
      datum: wall
      params: {concrete: B25, anchor_size: M16}
    - id: axle
      kind: shaft_seat
      name: "Посадка оси"
      datum: axle_axis
      params: {d: 50, fit_hole: H8, fit_shaft: f7, overhang: 30}

# параметры по умолчанию для всех вариантов; variants/*.yaml перекрывают их
params:
  material: St3sp
  height_ratio: 1.0          # высота элементов у стены = height_ratio·вылет (округл. до 10)
  base_plate: {thickness: 16, edge: 45, corner_radius: 10}
  anchors: {clearance: 3}    # зазор между головкой ключа и катетом шва
  welds: {leg_wall: 8, leg_other: 6}

assumptions:
  - {id: G1, topic: loads, text: "Нагрузка на ось задана для одного кронштейна (кронштейн — один из пары, нагрузка поделена поровну)."}
  - {id: G2, topic: loads, text: "Нагрузка статическая; динамика учтена коэффициентом γd, на выносливость не проверялось."}
  - {id: G3, topic: loads, text: "Требуемый запас K ≥ K_треб применён ко всем проверкам, включая анкеры и швы, где сопротивления уже расчётные — это консервативно."}
  - {id: G4, topic: geom, text: "Ось горизонтальна и параллельна стене; центр оси на уровне середины несущих элементов."}
  - {id: G5, topic: geom, text: "Ось неподвижна (не вращается в кронштейне); от осевого сдвига фиксируется торцевой шайбой — в модели не показана."}
  - {id: G6, topic: material, text: "Материал Ст3сп (С245) для всех листовых деталей и труб; эксплуатация в помещении."}
  - {id: G7, topic: wall, text: "Стена бетонная B25 с трещинами, толщина ≥ 250 мм, край стены далеко (c > c_min)."}
  - {id: G8, topic: anchors, text: "Анкеры химические, шпилька М16 кл. 5.8; несущая способность по бетону — условная из каталога пилота, заменить данными производителя (ETA)."}
  - {id: G9, topic: anchors, text: "Анкеры вынесены за след несущих элементов по X, чтобы ключ проходил к гайке; ряды анкеров на уровне верхней и нижней кромок элементов."}
  - {id: G10, topic: weld, text: "Сварка механизированная в CO2 (ГОСТ 14771), швы угловые; катет у плиты одинаковый для всех швов."}
  - {id: G11, topic: calc, text: "Расчёт оценочный: упругая работа, плита абсолютно жёсткая при распределении усилий на анкеры, центр сжатия — у нижней кромки плиты."}
