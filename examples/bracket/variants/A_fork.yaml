id: A_fork
title: "A. Вилка из двух щёк"
description: >
  Опорная плита и две параллельные щеки-проушины. Ось проходит через расточки обеих щёк.
  Минимум деталей, только листовой прокат.
params:
  topology: fork
  members:
    gap: 100             # расстояние между щеками в свету
    cheek_thickness: 12
    lug_ring: 25         # ширина кольца проушины вокруг расточки
assumptions:
  - "Расточка Ø50H8 выполняется в обеих щеках за одну установку после сварки (соосность)."
