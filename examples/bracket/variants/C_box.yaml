id: C_box
title: "C. Коробчатая консоль с бобышкой"
description: >
  Замкнутая коробка из двух боковин, верхнего и наклонного нижнего пояса, бобышка из трубы
  проходит сквозь боковины. Высокая жёсткость на кручение, все швы снаружи.
params:
  topology: box
  welds: {leg_wall: 6, leg_other: 6}
  members:
    boss_tube: "76x14"
    width: 120           # ширина коробки по наружным граням боковин
    side_thickness: 8
    cover_thickness: 8
    side_ring: 15        # кольцо боковины вокруг бобышки
    boss_protrusion: 5   # выступ бобышки за боковину
