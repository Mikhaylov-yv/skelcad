# https://skelcad.br → стек skelcad на cloud (compose/stack.yml). Ставится деплоем.
# Сертификат — общий br.crt; skelcad.br должен быть в его SAN (add-domain.sh на malina).
server {
    listen 80;
    server_name skelcad.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skelcad.br;

    ssl_certificate     /etc/ssl/home_certs/br.crt;
    ssl_certificate_key /etc/ssl/home_certs/br.key;

    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    # Агент: MCP по Bearer-токену, мимо oauth2-proxy. Заголовки пользователя вычищаем,
    # чтобы их нельзя было подсунуть в обход входа. Сборка может идти минуты — длинный таймаут.
    location = /mcp {
        proxy_pass http://127.0.0.1:8471;
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8471;
    }

    # Workbench, /api, /out, /oauth2 — только после входа через Keycloak (oauth2-proxy → server).
    location / {
        proxy_pass http://127.0.0.1:8472;
        proxy_read_timeout 600s;
        proxy_buffer_size 16k;     # cookie сессии oauth2-proxy с токенами Keycloak крупные
        proxy_buffers 8 16k;
    }
}
