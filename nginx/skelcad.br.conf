# https://skelcad.br → стек skelcad на cloud (compose/stack.yml). Ставится деплоем.
# Сертификат — общий br.crt; skelcad.br должен быть в его SAN (add-domain.sh на malina).
server {
    listen 80;
    server_name skelcad.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name skelcad.br;

    ssl_certificate     /etc/ssl/home_certs/br.crt;
    ssl_certificate_key /etc/ssl/home_certs/br.key;

    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;

    # Агент: MCP по Bearer-токену (проверяет приложение). Сборка может идти минуты — длинный таймаут.
    location = /mcp {
        proxy_pass http://127.0.0.1:8471;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # REST для CLI и workbench. Пока SKELCAD_AUTH=none — только из домашней сети и VPN (шаг 2 M2: за Keycloak).
    location /api/ {
        allow 127.0.0.1;
        allow 19.89.1.0/24;
        allow 10.9.0.0/16;
        allow 10.10.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8471;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8471;
    }

    # Артефакты сборок (STEP, glTF, compare.html) — только из домашней сети и VPN (шаг 2 M2: за Keycloak).
    location /out/ {
        allow 127.0.0.1;
        allow 19.89.1.0/24;
        allow 10.9.0.0/16;
        allow 10.10.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8471;
    }

    # Workbench (M2): статика из сервера; тот же список подсетей до шага 2.
    location / {
        allow 127.0.0.1;
        allow 19.89.1.0/24;
        allow 10.9.0.0/16;
        allow 10.10.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:8471;
    }
}
