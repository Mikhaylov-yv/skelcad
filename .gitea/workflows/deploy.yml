name: Deploy skelcad

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SRV: srv/skelcad
  COMPOSE: docker compose -f compose/stack.yml --env-file compose/.env

jobs:
  deploy-cloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rsync
        run: |
          if ! command -v rsync >/dev/null; then
            apt-get update -qq && apt-get install -y -qq rsync
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ vars.CLOUD_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup current state (single-overwrite)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.CLOUD_USER }}@${{ vars.CLOUD_HOST }} "
            mkdir -p \$HOME/$SRV \$HOME/$SRV.bak
            rsync -a --delete \$HOME/$SRV/ \$HOME/$SRV.bak/ 2>/dev/null || true
          "

      - name: Sync files to host
        run: |
          rsync -az --delete --exclude='.git' --exclude='.gitea' --exclude='compose/.env' \
            --exclude='.venv' --exclude='.tmp' --exclude='**/out' --exclude='**/__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ vars.CLOUD_USER }}@${{ vars.CLOUD_HOST }}:$SRV/

      - name: Write .env from compose/env.home + secrets
        run: |
          {
            cat compose/env.home
            echo "SKELCAD_TOKENS=${{ secrets.SKELCAD_TOKENS }}"
            echo "OIDC_CLIENT_SECRET=${{ secrets.OIDC_CLIENT_SECRET }}"
            echo "COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}"
            echo "LLM_API_KEY=${{ secrets.SKELCAD_LLM_API_KEY }}"
          } | ssh -i ~/.ssh/deploy_key ${{ vars.CLOUD_USER }}@${{ vars.CLOUD_HOST }} \
            "umask 077 && cat > \$HOME/$SRV/compose/.env
             # токен встроенного агента — локальный для хоста, создаётся один раз
             mkdir -p \$HOME/.config/skelcad
             test -s \$HOME/.config/skelcad/agent.token || openssl rand -hex 24 > \$HOME/.config/skelcad/agent.token
             echo AGENT_TOKEN=\$(cat \$HOME/.config/skelcad/agent.token) >> \$HOME/$SRV/compose/.env
             # пароль Postgres (граф связей) — локальный для хоста, создаётся один раз
             test -s \$HOME/.config/skelcad/pg.password || openssl rand -hex 24 > \$HOME/.config/skelcad/pg.password
             echo PG_PASSWORD=\$(cat \$HOME/.config/skelcad/pg.password) >> \$HOME/$SRV/compose/.env"

      - name: Validate, build, deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.CLOUD_USER }}@${{ vars.CLOUD_HOST }} \
            "SRV='$SRV' COMPOSE='$COMPOSE' bash -s" <<'EOF'
          set -e
          cd $HOME/$SRV
          if ! $COMPOSE config -q; then
            echo "compose invalid, rolling back"
            rsync -a --delete $HOME/$SRV.bak/ $HOME/$SRV/
            exit 1
          fi
          $COMPOSE build --pull
          $COMPOSE up -d --remove-orphans --wait --wait-timeout 300
          $COMPOSE ps
          # прод и разработка на одной машине с общим диском: старые слои образов не копим
          docker image prune -f >/dev/null || true
          EOF

      - name: Install nginx vhost (skelcad.br), smoke-check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ vars.CLOUD_USER }}@${{ vars.CLOUD_HOST }} \
            "SRV='$SRV' bash -s" <<'EOF'
          set -e
          sudo -n /usr/local/sbin/install-nginx-vhost skelcad.br "$HOME/$SRV/nginx/skelcad.br.conf"
          # -k: имя в SAN сертификата добавляется отдельно (add-domain.sh на malina), smoke-check от него не зависит
          C="curl -sk -o /dev/null -w %{http_code} --resolve skelcad.br:443:127.0.0.1"
          for i in 1 2 3 4 5 6; do
            # /health → 200 и graph: ok (Postgres); /mcp без токена → 401; / → 302 на вход Keycloak (oauth2-proxy)
            h=$($C https://skelcad.br/health); m=$($C -X POST https://skelcad.br/mcp); r=$($C https://skelcad.br/)
            g=$(curl -sk --resolve skelcad.br:443:127.0.0.1 https://skelcad.br/health | grep -o '"graph": *"[a-z]*"' | grep -o '[a-z]*"$' | tr -d '"')
            echo "attempt $i: /health $h (graph $g), /mcp $m, / $r"
            if [ "$h" = 200 ] && [ "$g" = ok ] && [ "$m" = 401 ] && [ "$r" = 302 ]; then
              echo "https://skelcad.br OK"; exit 0
            fi
            sleep 5
          done
          docker logs --tail 30 skelcad-server
          docker logs --tail 20 skelcad-db || true
          docker logs --tail 20 skelcad-oauth2-proxy || true
          echo "https://skelcad.br FAILED"; exit 1
          EOF
