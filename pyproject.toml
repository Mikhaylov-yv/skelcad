[project]
name = "skelcad"
version = "0.0.1"
description = "Top-down collaborative design environment: AI agent + design engineer. Core, agent API, CLI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "trimesh>=4.0",
    "mcp>=1.30,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "resvg-py>=0.5",
]

[project.optional-dependencies]
gost = ["skelcad-std-gost"]

[project.scripts]
skelcad = "skelcad.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "skelcad-std-gost", "httpx>=0.27"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
skelcad-std-gost = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skelcad"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
