# Сварка механизированная в CO2, проволока Св-08Г2С d=1,2 мм (ГОСТ 14771-76).
# СП 16.13330.2017: Rwf — табл. Г.2; Rwz = 0,45·Run; beta_f, beta_z — табл. 39.
Rwf: 215
beta_f: 0.9
beta_z: 1.05
# Минимальный катет углового шва по толщине более толстого элемента, табл. 38 (Ry до 285 МПа)
k_min_by_t:   # [t_max_до, k_min]
  - [5, 4]
  - [10, 5]
  - [16, 6]
  - [22, 7]
  - [32, 8]
  - [40, 9]
k_max_factor: 1.2   # k_max = 1,2·t_min
# Доступ горелки: ширина щели и отношение глубины к ширине
access_gap_min: 40
access_depth_ratio_max: 2.0
