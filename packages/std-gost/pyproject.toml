[project]
name = "skelcad-std-gost"
version = "0.0.1"
description = "SkelCAD standard package: GOST / SP tables (sheet, tubes, fasteners, anchors, fits, welds, materials) and rules."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.entry-points."skelcad.standards"]
gost = "skelcad_std_gost"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skelcad_std_gost"]
