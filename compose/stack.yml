# skelcad.br — сервер SkelCAD с точкой MCP для агентов (README, docs/architecture/04-m1-plan.md).
#   server — FastAPI: / (workbench), /mcp (Bearer-токен), /api, /out (артефакты); проекты — git-репозитории в /data/projects
#   db — Postgres: производный индекс сущностей и связей (граф связей, M2.2, D27); пересобирается из git
#            и комплектов сборок, резервная копия не нужна
#   worker — тот же образ, цикл по файловой очереди /data/jobs; исполняет код проектов (генераторы, OCCT)
#            в подпроцессах с лимитами; без сети, с ограничением CPU/памяти/процессов
#   oauth2-proxy — вход через Keycloak (realm home) для браузера: /, /api, /out; передаёт пользователя
#            в server заголовками X-Forwarded-User/-Email (SKELCAD_AUTH=proxy)
# Наружу — только loopback; маршруты раздаёт host-nginx (nginx/skelcad.br.conf): /mcp — в server напрямую,
# остальное — через oauth2-proxy.
name: skelcad

services:
  server:
    build:
      context: ..
    image: skelcad:local
    container_name: skelcad-server
    init: true
    restart: unless-stopped
    environment:
      SKELCAD_DATA: /data
      SKELCAD_JOBS: /data/jobs
      SKELCAD_TOKENS: ${SKELCAD_TOKENS:?}
      SKELCAD_AUTH: ${SKELCAD_AUTH:-tokens}
      SKELCAD_AGENT_TOKEN: ${AGENT_TOKEN:?}
      SKELCAD_TASKS: /data/tasks
      SKELCAD_SEED: ${SKELCAD_SEED:-bracket,pipe_support,plate}
      SKELCAD_JOB_TIMEOUT_S: ${JOB_TIMEOUT_S:-180}
      PUBLIC_URL: ${PUBLIC_URL:?}
      SKELCAD_DATABASE_URL: postgresql://skelcad:${PG_PASSWORD:?}@db:5432/skelcad
    volumes:
      - data:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:?}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: skelcad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skelcad
      POSTGRES_DB: skelcad
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skelcad -d skelcad"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: skelcad:local
    container_name: skelcad-worker
    init: true
    restart: unless-stopped
    command: ["skelcad", "worker", "--queue", "/data/jobs"]
    environment:
      SKELCAD_LIMIT_CPU_S: ${LIMIT_CPU_S:-170}
      SKELCAD_LIMIT_MEM_MB: ${LIMIT_MEM_MB:-3072}
    volumes:
      - data:/data
    network_mode: none
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEM:-4g}
    pids_limit: 256
    depends_on:
      server:
        condition: service_started

  # Встроенный агент (задачи из workbench): цикл с моделью любого провайдера по OpenAI-совместимому API,
  # инструменты — через /mcp сервера с токеном «workbench-agent». Сеть нужна: сервер + провайдер модели.
  agent:
    image: skelcad:local
    container_name: skelcad-agent
    init: true
    restart: unless-stopped
    command: ["skelcad", "agent", "--queue", "/data/tasks"]
    environment:
      SKELCAD_AGENT_RUNNER: ${AGENT_RUNNER:-openai}
      SKELCAD_LLM_BASE_URL: ${LLM_BASE_URL:-}
      SKELCAD_LLM_API_KEY: ${LLM_API_KEY:-}
      SKELCAD_LLM_MODEL: ${LLM_MODEL:-}
      SKELCAD_SERVER_URL: http://server:8000/mcp
      SKELCAD_AGENT_TOKEN: ${AGENT_TOKEN:?}
      SKELCAD_AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-60}
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - data:/data
      - /etc/ssl/home_certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      server:
        condition: service_healthy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: skelcad-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Keycloak
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-missing}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_URL}/oauth2/callback
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_NAME: _skelcad_session
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_UPSTREAMS: http://server:8000/
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 600s
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Keycloak на auth.br подписан CA сети .br — Go берёт корни из этого файла.
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - /etc/ssl/home_certs/ca.crt:/certs/ca.crt:ro
    ports:
      - "127.0.0.1:${PROXY_PORT:?}:4180"
    depends_on:
      server:
        condition: service_started

volumes:
  data:
  pgdata:

# Пулы docker по умолчанию на cloud исчерпаны — подсеть явно (drawio занял 10.88.10.0/24).
networks:
  default:
    ipam:
      config:
        - subnet: 10.88.11.0/24
